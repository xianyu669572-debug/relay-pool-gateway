name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark
        run: python scripts/benchmark.py --cases tests/benchmark/cases.jsonl --holdout tests/benchmark/holdout.jsonl
      - name: Sensitive info scan
        run: python scripts/scan_repo.py
